<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RibhPlus — ربح بلس</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin: 10px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      background: #111827;
      font-weight: bold;
    }

    .featured-button {
      background: #d97706;
    }

    h2 {
      margin-top: 30px;
      margin-bottom: 16px;
    }

    .empty {
      background: white;
      padding: 30px;
      border-radius: 14px;
      text-align: center;
      color: #6b7280;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #6b7280;
    }
  </style>
</head>

<body>

<header>
  <h1>📢 RibhPlus</h1>
  <p>منصة الإعلانات داخل Telegram</p>
</header>

<div class="container">

  <div class="buttons">

    <a
      class="button featured-button"
      href="https://t.me/RibhPlusBot"
      target="_blank"
    >
      📢 نشر إعلان
    </a>

    <a
      class="button"
      href="https://t.me/RibhPlusBot"
      target="_blank"
    >
      ⭐ إعلان مميز
    </a>

  </div>

  <h2>⭐ الإعلانات المميزة</h2>

  <div class="empty">
    سيتم عرض الإعلانات المميزة هنا.
  </div>

  <h2>🆕 أحدث الإعلانات</h2>

  <div class="empty">
    سيتم عرض أحدث الإعلانات هنا.
  </div>

</div>

<footer>
  RibhPlus © 2026
</footer>

</body>
</html>
